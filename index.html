<body>
  <header class="topbar shell">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="3.2"/><path d="M12 2v2M12 20v2"/></svg></div>
      <div><div class="brand-title">SPY NETWORK</div><div class="brand-sub">TRUST NO ONE</div></div>
    </div>
    <div class="top-actions">
      <div id="connectionStatus" class="status"><span class="status-dot"></span><span id="connectionText">جارٍ الاتصال</span></div>
      <div id="userChip" class="user-chip"><div class="avatar" id="topAvatar">A</div><span id="topUsername" class="user-short"></span></div>
    </div>
  </header>

  <main class="shell">
    <section id="authView" class="auth-wrap view">
      <div class="auth-card">
        <div class="auth-heading">
          <div class="auth-emblem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="3.2"/><path d="M4 4l2 2M20 4l-2 2"/></svg></div>
          <h1>مهمتك تبدأ الآن</h1><p>كوّن فريقك، اخفِ هويتك، واكتشف الجاسوس.</p>
        </div>
        <div class="auth-tabs"><button class="auth-tab active" id="loginTab" type="button">تسجيل الدخول</button><button class="auth-tab" id="registerTab" type="button">إنشاء حساب</button></div>
        <form id="authForm">
          <div class="field"><label for="usernameInput">اسم المستخدم</label><input id="usernameInput" name="username" autocomplete="username" placeholder="مثال: agent_007" maxlength="20" required></div>
          <div id="displayNameField" class="field hidden"><label for="displayNameInput">الاسم الظاهر داخل اللعبة</label><input id="displayNameInput" name="displayName" autocomplete="nickname" placeholder="الاسم الذي يراه أصدقاؤك" maxlength="24"></div>
          <div class="field"><label for="passwordInput">كلمة المرور</label><input id="passwordInput" name="password" type="password" autocomplete="current-password" placeholder="8 أحرف على الأقل عند التسجيل" minlength="8" maxlength="128" required></div>
          <div id="authHint" class="hint hidden">اسم المستخدم من 3 إلى 20 حرفًا أو رقمًا، وكلمة المرور 8 أحرف على الأقل.</div>
          <div id="authError" class="auth-error hidden" role="alert"></div>
          <button id="authSubmit" class="btn btn-primary btn-block" type="submit">دخول إلى الشبكة <span>←</span></button>
        </form>
        <p class="auth-foot">حسابك يُستخدم لحفظ اسمك وقائمة أصدقائك على هذا السيرفر.</p>
      </div>
    </section>

    <section id="appView" class="view hidden">
      <div class="tabs" id="mainTabs"><button class="navtab active" data-page="play">🎮 اللعب</button><button class="navtab" data-page="friends">👥 الأصدقاء</button><button class="navtab" data-page="profile">⚙️ حسابي</button></div>
      <div id="appContent"></div>
      <div class="footnote">SPY NETWORK <span class="copyright">· PRIVATE ROOMS · HIDDEN ROLES</span></div>
    </section>
  </main>

  <div id="toastWrap" class="toast-wrap" aria-live="polite"></div>

  <script>

      } else if (room.phase === 'spy_guess') {
        output += `<div class="state-banner"><div class="state-icon">🎯</div><div><strong>فرصة أخيرة للجاسوس</strong><span>${escapeHtml(room.endMessage||'خمن كلمة المواطنين.')}</span></div></div>`;
        if (myRole?.role==='spy') output += `<form id="guessForm" class="clue-form"><input name="guess" maxlength="100" placeholder="ما الكلمة السرية؟" required><button class="btn btn-primary" type="submit">تأكيد التخمين</button></form><p class="small muted">إذا عرفت الكلمة، يفوز الجاسوس. إذا أخطأت، يفوز المواطنون.</p>`;
        else output += `<div class="empty-state"><div class="empty-icon">⏳</div>الجاسوس يفكر الآن في الكلمة…</div>`;
        output += `<div class="section-label">التلميحات السابقة</div>${renderClues(room.clues)}`;
      } else if (room.phase === 'ended') {
        const spyWon = room.winner === 'spy';
        output = `<div class="result-card ${spyWon?'spy-win':'citizens-win'}"><div class="result-symbol">${spyWon?'🕶️':'🏆'}</div><h2>${spyWon?'فاز الجاسوس!':'فاز المواطنون!'}</h2><p>${escapeHtml(room.endMessage||'انتهت الجولة.')}</p><div class="result-word">الكلمة: ${escapeHtml(room.word||'—')}</div></div><div class="section-label">كشف الأدوار</div><div class="role-reveals">${(room.roles||[]).map(player=>`<div class="role-reveal ${player.role==='spy'?'spy':''}"><strong>${escapeHtml(player.displayName)}</strong><span>${player.role==='spy'?'🕶️ الجاسوس':'👤 مواطن'}</span></div>`).join('')}</div>${room.spyGuess?`<p class="small muted">تخمين الجاسوس: ${escapeHtml(room.spyGuess)}</p>`:''}<div class="divider"></div>${room.youAreHost?`<button class="btn btn-primary btn-block" data-act="start-game">🔄 جولة جديدة بنفس اللاعبين</button>`:`<div class="empty-state">انتظر المضيف ليبدأ جولة جديدة.</div>`}`;
      }
      if (room.phase !== 'ended') output += `<div class="section-label">حالة الجولة</div><div class="room-item"><div class="room-code-icon">${room.votesSubmitted||0}</div><div class="room-info"><strong>${room.phase==='clues'?'تلميحات مكتملة':room.phase==='voting'?'أصوات مسجّلة':'الجولة جارية'}</strong><span>${room.phase==='clues'?`${room.clues.length} من ${room.players.length} تلميحات`:room.phase==='voting'?`${room.votesSubmitted} من ${room.votesTotal} أصوات`:'تابع التعليمات أعلاه'}</span></div></div>`;
      return output;
    }
    function renderClues(clues) {
      if (!clues?.length) return `<div class="empty-state">لم يقدم أحد تلميحًا بعد.</div>`;
      return `<div>${clues.map((clue,index)=>`<div class="clue-item"><div class="clue-avatar">${index+1}</div><div class="clue-content"><strong>${escapeHtml(clue.displayName)}</strong><p>${escapeHtml(clue.text)}</p></div></div>`).join('')}</div>`;
    }

    $('#loginTab').addEventListener('click', () => setAuthMode(false));
    $('#registerTab').addEventListener('click', () => setAuthMode(true));
    $('#authForm').addEventListener('submit', async event => {
      event.preventDefault(); hideAuthError();
      if (!ws || ws.readyState !== WebSocket.OPEN) { showAuthError('السيرفر غير متصل بعد. شغّل السيرفر وانتظر الاتصال.'); return; }
      const username = $('#usernameInput').value.trim(); const password = $('#passwordInput').value;
      const displayName = $('#displayNameInput').value.trim();
      const button = $('#authSubmit'); const original = button.innerHTML; button.disabled = true; button.innerHTML = '<span class="spinner"></span> جارٍ التحقق…';
      try {
        const result = await request(isRegister ? 'auth:register' : 'auth:login', {username,password,displayName});
        token = result.token; localStorage.setItem('spy_token', token); currentUser = result.user; page='play';
        await refreshLists(); showApp(); toast(isRegister?'تم إنشاء الحساب بنجاح. مرحبًا بك!':'مرحبًا بعودتك إلى الشبكة.', 'success');
      } catch (error) { showAuthError(error.message); }
      finally { button.disabled = false; button.innerHTML = original; }
    });

    document.addEventListener('click', async event => {
      const tab = event.target.closest('[data-page]');
      if (tab && currentUser) { page = tab.dataset.page; renderApp(); if (page==='friends') { try { friendsData = await request('friends:list'); renderApp(); } catch {} } return; }
      const control = event.target.closest('[data-act]'); if (!control) return;
      const action = control.dataset.act;
      try {
        if (action==='select-count') { selectedPlayers = Number(control.dataset.count); renderApp(); }
        else if (action==='create-room') { const result=await request('room:create',{maxPlayers:selectedPlayers}); toast(`تم إنشاء الغرفة ${result.code}`,'success'); }
        else if (action==='join-room') await request('room:join',{code:control.dataset.code});
        else if (action==='refresh-rooms') { roomsList=await request('rooms:list'); renderApp(); toast('تم تحديث قائمة الغرف.','success'); }
        else if (action==='leave-room') { await request('room:leave'); currentRoom=null; myRole=null; renderApp(); }
        else if (action==='start-game') await request('room:start');
        else if (action==='copy-code') { const code=currentRoom?.code; if (!code) return; try { await navigator.clipboard.writeText(code); } catch { const input=document.createElement('textarea'); input.value=code; document.body.appendChild(input); input.select(); document.execCommand('copy'); input.remove(); } toast('تم نسخ رمز الغرفة: '+code,'success'); }
        else if (action==='vote') { await request('game:vote',{username:control.dataset.username}); toast('تم تسجيل تصويتك.','success'); }
        else if (action==='quick-clue') { const input=$('#clueForm input[name="clue"]'); if (input) { input.value=control.dataset.text; input.focus(); } }
        else if (action==='friend-respond') { await request('friends:respond',{username:control.dataset.username,accept:control.dataset.accept==='true'}); friendsData=await request('friends:list'); renderApp(); toast(control.dataset.accept==='true'?'تم قبول طلب الصداقة.':'تم رفض الطلب.','success'); }
        else if (action==='invite-friend') { await request('friends:invite',{username:control.dataset.username}); toast('تم إرسال الدعوة إلى صديقك.','success'); }
        else if (action==='accept-invite') { if (!incomingInvite) return; const invitation=incomingInvite; incomingInvite=null; await request('room:join',{code:invitation.code}); }
        else if (action==='dismiss-invite') { incomingInvite=null; renderApp(); }
        else if (action==='logout') { await request('auth:logout'); token='';localStorage.removeItem('spy_token');showAuth();toast('تم تسجيل الخروج.','info'); }
      } catch (error) { toast(error.message || 'تعذر تنفيذ العملية.','error'); }
    });
    document.addEventListener('submit', async event => {
      if (event.target.id==='joinForm') {
        event.preventDefault(); const code=$('#joinCode').value.trim().toUpperCase(); if (code.length!==5) { toast('رمز الغرفة يتكون من 5 أحرف أو أرقام.','error'); return; }
        try { await request('room:join',{code}); } catch(error) { toast(error.message,'error'); }
      } else if (event.target.id==='addFriendForm') {
        event.preventDefault(); const input=event.target.elements.friendUsername; const username=input.value.trim();
        try { await request('friends:request',{username}); friendsData=await request('friends:list'); renderApp(); toast('تم إرسال طلب الصداقة.','success'); }
        catch(error) { toast(error.message,'error'); }
      } else if (event.target.id==='clueForm') {
        event.preventDefault(); const input=event.target.elements.clue; const text=input.value.trim();
        try { await request('game:clue',{text}); }
        catch(error) { toast(error.message,'error'); }
      } else if (event.target.id==='guessForm') {
        event.preventDefault(); const word=event.target.elements.guess.value.trim();
        try { await request('game:spy-guess',{word}); }
        catch(error) { toast(error.message,'error'); }
      } else if (event.target.id==='profileForm') {
        event.preventDefault(); const displayName=event.target.elements.displayName.value.trim();
        try { const result=await request('profile:update',{displayName}); currentUser=result.user; showTopUser(); renderApp(); toast('تم تحديث الملف الشخصي.','success'); }
        catch(error) { toast(error.message,'error'); }
      }
    });

    connectSocket();
    setInterval(() => { if (currentUser && ws?.readyState===WebSocket.OPEN) { request('rooms:list').then(data=>{ roomsList=data; if(page==='play'&&!currentRoom)renderApp(); }).catch(()=>{}); if(page==='friends') request('friends:list').then(data=>{friendsData=data;renderApp();}).catch(()=>{}); } }, 15000);
  })();
  </script>
</body>
</html>
